name: Fork Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.0.12-alpha)'
        required: true
        default: 'v0.0.12-alpha'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
            make
            zip
            diffutils

      - name: Build (Windows release, EOS disabled)
        shell: msys2 {0}
        run: make BUILD=release build

      - name: Package release archive
        shell: msys2 {0}
        run: |
          mkdir -p release
          cp build/bin/openwarcraft3.exe release/
          cp -r build/lib/. release/
          cp -r build/share release/
          bash dist-scripts/windows/bundle_mingw_dlls.sh release \
            build/bin/openwarcraft3.exe build/lib/*.dll
          cd release && zip -r ../openwarcraft3-windows-x64.zip .

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-windows-x64
          path: openwarcraft3-windows-x64.zip

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" openwarcraft3-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenRealm ${{ inputs.tag }} (fork build)" \
            --notes "Windows x64 release build from this fork. EOS/online services disabled; single-player and LAN supported."
