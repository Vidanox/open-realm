name: Fork Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create'
        required: true
        default: 'fork-build'
      msaa:
        description: 'MSAA sample count (fixed at build time; 0 disables)'
        type: choice
        options: ['0', '2', '4', '8']
        default: '8'
      ffmpeg:
        description: 'FFmpeg media backend (movies + compressed music)'
        type: choice
        options: ['0', '1']
        default: '1'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            make
            zip
            diffutils

      - name: Build (Windows release, EOS disabled)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make BUILD=release MSAA=${{ inputs.msaa }} FFMPEG=${{ inputs.ffmpeg }} build
          if [ "${{ inputs.ffmpeg }}" = "1" ]; then
            echo "== DLL imports (libav/libsw) =="
            objdump -p build/bin/openwarcraft3.exe | grep -i -E 'DLL Name:.*(avcodec|avformat|avutil|swscale|swresample)' || echo "none found"
            echo "== ldd (libav/libsw) =="
            ldd build/bin/openwarcraft3.exe | grep -i -E 'avcodec|avformat|avutil|swscale|swresample' || echo "none found"
            if grep -aq "playback is disabled in this build" build/bin/openwarcraft3.exe; then
              echo "FFmpeg was not compiled into the binary" >&2
              exit 1
            fi
          fi

      - name: Package release archive
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/bin/openwarcraft3.exe release/
          cp -r build/lib/. release/
          cp -r build/share release/
          bash dist-scripts/windows/bundle_mingw_dlls.sh release \
            build/bin/openwarcraft3.exe build/lib/*.dll
          if [ "${{ inputs.ffmpeg }}" = "1" ]; then
            ls release/avcodec-*.dll release/avformat-*.dll >/dev/null
          fi
          cd release && zip -r ../openwarcraft3-windows-x64.zip .

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-windows-x64-msaa${{ inputs.msaa }}-ffmpeg${{ inputs.ffmpeg }}
          path: openwarcraft3-windows-x64.zip

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" openwarcraft3-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenRealm ${{ inputs.tag }} (fork build, MSAA=${{ inputs.msaa }}, FFmpeg=${{ inputs.ffmpeg }})" \
            --notes "Windows x64 release build from upstream code. MSAA=${{ inputs.msaa }} (fixed at build time). FFmpeg=${{ inputs.ffmpeg }}. Upstream commit: $(git rev-parse HEAD). EOS/online services disabled."
